[project]
name = "odc-stats"
dynamic = ["version"]
description = "Statistical Product Generation Framework"
authors = [
    {name = "Open Data Cube", email = "earth.observation@ga.gov.au"},
]
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "ai-edge-litert",
    "botocore",
    "ciso8601",
    "click>=8.0.0",
    "dask",
    "datacube==1.9.5",
    "distributed>=2025.4,<2025.9",
    "eodatasets3>=1.9",
    "fiona",
    "fsspec>=2022.1.0",
    "geopandas",
    "numpy",
    "odc-cloud[ASYNC]>=0.2.5",
    "odc-geo>=0.5.0rc1",
    "odc_algo>=1.1.1",
    "odc_dscache>=1.9",
    "odc_io",
    "pandas",
    "pystac>=1.1.0",
    "rasterio>=1.3.2",
    "s3fs",
    "tl2cgen",
    "toolz",
    "tqdm",
    "xarray>=2023.1.0",
]

[project.urls]
Homepage = "https://github.com/opendatacube/odc-stats/"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest_httpserver",
    "moto"
]
ows = [
    "blinker",
    "datacube_ows>=1.9",
    "sentry-sdk",
]

[project.scripts]
odc-stats = "odc.stats.cli:main"

[tool.setuptools.packages.find]
exclude = ["tests"]
include = ["odc*"]

[build-system]
requires = ["setuptools>=69", "setuptools_scm[toml]>=8,!=9.2.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "odc/stats/_version.py"
fallback_version = "1.9.11.dev0"
