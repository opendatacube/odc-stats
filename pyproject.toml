[project]
name = "odc-stats"
dynamic = ["version"]
description = "Statistical Product Generation Framework"
authors = [
    {name = "Open Data Cube", email = "earth.observation@ga.gov.au"},
]
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "affine<3",
    "ai-edge-litert",
    "botocore",
    "ciso8601",
    "click>=8.0.0",
    "dask",
    "datacube>=1.9.10,<1.10",
    "distributed",
    "eodatasets3>=1.9",
    "fiona",
    "fsspec>=2022.1.0",
    "geopandas",
    "numpy",
    "odc-cloud[ASYNC]>=0.2.5",
    "odc-geo>=0.5.3",
    "odc_algo>=1.2.1",
    "odc_dscache>=1.9",
    "odc_io",
    "pandas",
    "pystac>=1.1.0",
    "rasterio>=1.3.2",
    "s3fs",
    "tl2cgen",
    "toolz",
    "tqdm",
    "xarray>=2023.1.0",
]

[tool.uv]
no-build-package = [
    "rasterio",
    "fiona",
    "pyproj",
    "shapely",
]

[project.urls]
Homepage = "https://github.com/opendatacube/odc-stats/"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest_httpserver",
    "moto"
]
ows = [
    "blinker",
    "datacube_ows>=1.9",
    "sentry-sdk",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest",
    "pytest-cov",
    "pytest_httpserver",
    "moto",
    "psycopg2-binary",
]

[project.scripts]
odc-stats = "odc.stats.cli:main"

[tool.setuptools.packages.find]
exclude = ["tests"]
include = ["odc*"]

[build-system]
requires = ["setuptools>=69", "setuptools_scm[toml]>=8,!=9.2.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "odc/stats/_version.py"
fallback_version = "1.9.11.dev0"


[tool.mypy]
python_version = '3.12'
allow_redefinition = true
enable_error_code = ['explicit-override']
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disable_error_code = 'import-untyped'
