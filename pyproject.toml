[build-system]
requires = ["setuptools>=69", "wheel", "setuptools_scm[toml]>=8,!=9.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odc-stats"
description = "Statistical Product Generation Framework"
dynamic = ["version"]
authors = [
    { name = "Open Data Cube"},
]
maintainers = [
    { name = "Open Data Cube"},
]
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "Apache License 2.0" }
requires-python = ">=3.10"
dependencies = [
    "botocore",
    "click>=8.0.0",
    "dask",
    "datacube>=1.9.6",
    "distributed>=2025.4",
    "numpy",
    "odc-cloud[ASYNC]>=0.2.5",
    "odc_algo[geomad]>=1.0.1",
    "odc_dscache>=1.9",
    "odc_io",
    "odc-geo>=0.5.0rc1",
    "pandas",
    "pystac>=1.1.0",
    "eodatasets3>=1.9",
    "toolz",
    "tqdm",
    "xarray>=2023.1.0",
    "ciso8601",
    "gdal",
    "fsspec>=2022.1.0",
    "fiona",
    "rasterio>=1.3.2",
    "s3fs",
    "ai-edge-litert",
    "tl2cgen",
]

[project.urls]
homepage = "https://github.com/opendatacube/odc-stats/"

[project.scripts]
odc-stats = "odc.stats.cli:main"

[project.optional-dependencies]
ows = [
    "datacube_ows>=1.9",
    "sentry-sdk",
    "blinker",
]

[tool.setuptools]
include-package-data = true
zip-safe = false
packages.find = { include = ["odc*"], namespaces = true }

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

