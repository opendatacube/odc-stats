name: Run Code Checks

on:
  push:
    branches-ignore: [develop]
    paths:
      - '**'
      - '!docker/**'
      - '!.github/workflows/statistician-*'
      - '!notebooks/**'
      - '!docs/**'
      - '!k8s/**'
      - '!README.md'
    tags:
      - '**'
  release:
    types:
      - published
  workflow_dispatch:

# When a PR is updated, cancel the jobs from the previous version. Merges
# do not define head_ref, so use run_id to never cancel those jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  quality:  # Do not fail on MyPy yet - needs uplift
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run MyPy
        run: |
          uv run mypy -p odc.stats || echo "WARNING: mypy did not pass"
        shell: bash

  run-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
          enable-uv-cache: ${{ !startsWith(github.ref, 'refs/tags/') }} # Disable cache on tags to prevent cache poisoning attack

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest --cov=odc --cov-report=xml --durations=5 tests
        env:
          AWS_DEFAULT_REGION: ap-southeast-2

  build-wheels:
    name: Build & verify package
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # setuptools_scm needs the full history to derive the version
          persist-credentials: false

      # Builds the sdist and wheel, runs twine check and check-wheel-contents,
      # and uploads them as the "Packages" artifact. Same action and pin as
      # opendatacube/odc-algo.
      - uses: hynek/build-and-inspect-python-package@efb823f52190ad02594531168b7a2d5790e66516 # v2.14.0
        with:
          attest-build-provenance-github: 'true'

  check-wheel-compat:
    # build-wheels emits a single py3-none-any wheel.
    # Check the dependency set on each supported interpreter.
    runs-on: ubuntu-latest
    needs:
      - build-wheels
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install wheel with full dependency resolution
        run: |
          ls -lh dist
          python -m pip install --upgrade pip
          # Deliberately no --no-deps: resolving every dependency is the point,
          # it is what catches a dep with no wheel for this interpreter.
          pip install ./dist/*.whl
          pip check
          odc-stats --version

  test-wheels:
    timeout-minutes: 25
    name: Test wheels on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    container:
      # Plain upstream Python images: the wheel and its dependencies are
      # installed from scratch rather than relying on a pre-baked environment.
      image: python:${{ matrix.python-version }}

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: opendatacube
          POSTGRES_PASSWORD: opendatacubepassword
          POSTGRES_USER: opendatacube

    needs:
      - check-wheel-compat

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install Dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
          --fix-missing --no-install-recommends \
          curl \
          gpg \
          zstd \
          libpq-dev
          python -m pip install --upgrade --no-cache pip
          pip install --no-cache -r \
          tests/requirements.txt
          pip freeze

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist

      - name: Install wheels for testing
        shell: bash
        run: |
          which python
          which datacube

          ls -lh dist
          pip install --no-cache dist/*whl
          pip check || true
          pip show odc-stats
          which odc-stats | xargs ls -alt
          odc-stats --version

      - name: Run Tests
        shell: bash
        run: |
          echo "Init DB"
          ./tests/init_db.sh

          echo "Running unit tests"
          pytest --cov=. \
          --cov-report=html \
          --cov-report=xml:coverage.xml \
          --timeout=30 tests

          echo "Running integration tests"
          ./tests/integration_test.sh

        env:
          ODC_DEFAULT_DB_HOSTNAME: postgres
          ODC_DEFAULT_DB_USERNAME: opendatacube
          ODC_DEFAULT_DB_PASSWORD: opendatacubepassword
          ODC_DEFAULT_DB_DATABASE: opendatacube
          AWS_NO_SIGN_REQUEST: true
          AWS_DEFAULT_REGION: ap-southeast-2
          AWS_REGION: ap-southeast-2
          STAC_API_URL: https://earth-search.aws.element84.com/v0/
          GDAL_HTTP_MAX_RETRY: 5

      - name: Upload Coverage
        if: |
          github.repository == 'opendatacube/odc-stats'

        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          verbose: false

  publish-pypi:
    name: Publish released package to pypi.org
    # Only a published GitHub Release: setuptools_scm derives a clean version
    # from the tag, whereas untagged commits build .devN+g<sha> local versions
    # that PyPI rejects.
    if: |
      github.repository_owner == 'opendatacube'
        && github.event.action == 'published'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Trusted Publishing; no PyPI API token needed
    needs:
      - run-tests
      - check-wheel-compat
      - test-wheels

    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
