# Conda environment for running tests in odc-tools
#   conda env create -f test-env-py310.yml
#   conda activate odc-tests-py310

name: odc-tests-py310
channels:
  - conda-forge
dependencies:
  - python=3.10

  # Datacube
  - datacube==1.9.0

  # odc.{aws,aio}: aiobotocore/boto3
  #  pin aiobotocore for easier resolution of dependencies
  - aiobotocore #==1.3.3
  - boto3

  # eodatasets3 (for odc-stats)
  - boltons
  - ciso8601
  - python-rapidjson
  - requests-cache  # 0.8.0 broke eodatasets3
  - ruamel.yaml
  - structlog
  - url-normalize

  # odc-stats
  - pandas
  - pystac>=1.1.0
  - toolz
  - tqdm
  # pin xarray version since groupby bug on multi-indexed dataset in 2022.6.0
  - xarray #==2023.12.0
  - gdal
  - fsspec>=2022.1.0
  - fiona

  # For tests
  - pytest
  - pytest-httpserver
  - pytest-cov
  - pytest-timeout
  - moto
  - mock
  - deepdiff
  # these may need to be in pip
  - s3fs
  # - tflite-runtime
  - tl2cgen

  # for pytest-depends
  - future_fstrings
  - networkx
  - colorama

  # for docs
  - sphinx
  - sphinx_rtd_theme
  - sphinx-autodoc-typehints
  - nbsphinx

  - pip=24
  - pip:
      # - odc-algo
      # - odc-dscache>=0.2.2
      - odc-cloud[ASYNC]
      - odc-geo>=0.4.10
      - odc-stac
      - odc-loader>=0.5.1
      - thredds-crawler

      # odc.stats
      - eodatasets3>=1.9

      # odc.algo optional dependency
      - hdstats
      - scipy<1.15.0  # cwt import removed in 1.15

      # tests
      - pytest-depends
      - tflite-runtime

      # init db
      - odc-apps-dc-tools>=1.9

      # for odc-stats
      - datacube_ows>=1.9
